name: ci

on:
  push:
    # wp/** so a work-package branch can be tested before it is merged.
    branches: [main, "wp/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      # Off so a failure on one OS does not cancel and hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --all-targets
      - name: test
        run: cargo test
